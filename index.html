<!DOCTYPE html>

<html lang="hy">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Քվիզ - Տեսապատկերման Արվեստ</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;700&display=swap');

        body {

            font-family: 'Noto Sans Armenian', sans-serif;

            background: #0f172a;

            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);

            min-height: 100vh;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0;

            overflow-x: hidden;

        }

        .glass-card {

            background: rgba(255, 255, 255, 0.03);

            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.1);

            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);

        }

        .option-btn {

            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

        }

        .option-btn:hover:not(:disabled) {

            background: rgba(59, 130, 246, 0.1);

            border-color: rgba(59, 130, 246, 0.5);

            transform: translateX(10px);

        }

        .ai-pulse {

            animation: pulse-glow 2s infinite;

        }

        @keyframes pulse-glow {

            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }

            70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }

            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }

        }

        .speaking-bar-container {

            display: flex;

            align-items: flex-end;

            gap: 4px;

            height: 30px;

        }

        .bar {

            width: 4px;

            background: #3b82f6;

            border-radius: 4px;

            animation: bounce 0.5s ease-in-out infinite alternate;

        }

        @keyframes bounce { from { height: 6px; } to { height: 30px; } }

        .fade-in { animation: fadeIn 0.5s ease-in; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }



        .ai-loader {

            border: 2px solid rgba(255,255,255,0.1);

            border-top: 2px solid #60a5fa;

            border-radius: 50%;

            width: 16px;

            height: 16px;

            animation: spin 1s linear infinite;

            display: inline-block;

        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>

</head>

<body>



    <div id="app" class="w-full max-w-2xl p-4">

        

        <!-- Welcome Screen -->

        <div id="activation-screen" class="glass-card rounded-[2.5rem] p-12 text-center fade-in">

            <div class="mb-10 flex justify-center">

                <div id="welcome-avatar" class="w-32 h-32 bg-blue-600 rounded-full flex items-center justify-center text-7xl transition-all duration-500">

                    <i class="fas fa-robot text-white"></i>

                </div>

            </div>

            <h1 id="welcome-title" class="text-4xl font-black mb-6 tracking-tight bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent uppercase">ԱԲ Ուղեկից</h1>

            

            <p id="welcome-subtext" class="text-blue-100/70 text-lg mb-10 leading-relaxed">

                Բարև ձեզ: Ես ձեր ԱԲ ուղեկիցն եմ:<br>Սեղմեք կոճակը՝ սկսելու համար:

            </p>



            <div id="intro-speaking-indicator" class="hidden flex justify-center mb-10">

                <div class="speaking-bar-container">

                    <div class="bar" style="animation-delay: 0.1s"></div>

                    <div class="bar" style="animation-delay: 0.2s"></div>

                    <div class="bar" style="animation-delay: 0.3s"></div>

                    <div class="bar" style="animation-delay: 0.4s"></div>

                    <div class="bar" style="animation-delay: 0.5s"></div>

                </div>

            </div>



            <button id="activate-btn" onclick="startApp(event)" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-5 px-16 rounded-2xl text-xl transition-all shadow-xl flex items-center mx-auto group">

                ԱԲ քուիզ <i class="fas fa-play ml-3 group-hover:scale-110 transition-transform"></i>

            </button>

        </div>



        <!-- Quiz Container -->

        <div id="main-container" class="hidden glass-card rounded-[2.5rem] p-10 text-center relative overflow-hidden fade-in">

            <div class="mb-8 flex flex-col items-center">

                <div id="ai-avatar" class="w-24 h-24 bg-blue-600 rounded-full flex items-center justify-center text-5xl mb-4 transition-all">

                    <i class="fas fa-robot text-white"></i>

                </div>

                

                <div id="ai-status-box" class="h-6 flex items-center justify-center">

                    <div id="speaking-indicator" class="hidden speaking-bar-container">

                        <div class="bar" style="animation-delay: 0.1s"></div>

                        <div class="bar" style="animation-delay: 0.2s"></div>

                        <div class="bar" style="animation-delay: 0.3s"></div>

                    </div>

                    <div id="ai-thinking" class="hidden text-xs text-blue-400 font-bold italic">

                        <span class="ai-loader mr-2"></span> ✨ ԱԲ-ն մտածում է...

                    </div>

                </div>

            </div>



            <div id="content-area">

                <div id="quiz-view">

                    <div class="flex justify-between items-center mb-6 text-white">

                        <span id="q-num" class="text-xs font-bold text-blue-400 uppercase tracking-widest"></span>

                        <div class="w-32 h-1 bg-white/10 rounded-full overflow-hidden">

                            <div id="progress-bar" class="h-full bg-blue-500 transition-all duration-500"></div>

                        </div>

                    </div>

                    <h2 id="q-text" class="text-xl font-bold mb-6 text-left leading-tight min-h-[3.5rem] text-white"></h2>

                    <div id="options-grid" class="grid gap-3 mb-8"></div>

                    

                    <div id="feedback-area" class="hidden space-y-4 mb-6">

                        <div id="feedback-box" class="p-4 rounded-2xl bg-white/5 border border-white/10 text-white text-center italic"></div>

                        <div id="ai-deep-dive" class="hidden p-4 rounded-2xl bg-blue-500/10 border border-blue-500/20 text-sm text-blue-100 text-left leading-relaxed"></div>

                        <button id="ask-more-btn" onclick="getDeepDive()" class="text-xs text-blue-400 hover:text-blue-300 flex items-center gap-2 mx-auto font-bold transition-all">

                            ✨ Իմանալ ավելին այս թեմայի մասին

                        </button>

                    </div>



                    <button id="next-btn" onclick="nextQuestion()" class="hidden w-full bg-white text-slate-900 font-black py-4 rounded-2xl hover:bg-blue-50 transition-all flex items-center justify-center gap-2 shadow-lg">

                        <span id="next-btn-text">Հաջորդ հարցը</span> <i class="fas fa-chevron-right"></i>

                    </button>

                </div>



                <div id="result-view" class="hidden text-white">

                    <div id="res-icon" class="text-6xl mb-4"></div>

                    <h2 id="res-title" class="text-2xl font-bold mb-2 text-white"></h2>

                    <div id="res-score" class="text-5xl font-black text-blue-500 mb-12 text-white"></div>

                    

                    <button onclick="location.reload()" class="bg-blue-600 py-3 px-12 rounded-xl font-bold hover:bg-blue-500 transition-colors shadow-lg">Փորձել նորից</button>

                </div>

            </div>

        </div>

    </div>



    <script>

        const apiKey = ""; 

        

        let currentQuestion = 0;

        let score = 0;

        let currentAudio = null;

        let aiActivated = false;

        let wrongTopics = [];

        let audioTaskId = 0; // Counter to handle async task overlapping



        const questions = [

            { 

                q: "Ի՞նչ է Արհեստական բանականությունը (ԱԲ):", 

                options: [

                    "Տեխնոլոգիաների և ալգորիթմների համակցություն է, որը հնարավորություն է տալիս համակարգերին ավտոմատացնել տարբեր գործընթացներ՝ առանց պարտադիր կերպով ներառելու սովորելու կամ ադապտացվելու կարողություն", 

                    "Տեխնոլոգիաների, տվյալների և հաշվարկային մոդելների համակցություն է, որի նպատակն է ստեղծել համակարգեր, որոնք գործում են հիմնականում նախապես սահմանված կանոնների հիման վրա", 

                    "Տեխնոլոգիաների, մեթոդների և հաշվարկային մոդելների համակցություն է, որը հնարավորություն է տալիս համակարգերին իրականացնել մարդկային ինտելեկտի հետ կապվող գործառույթներ՝ սովորել, եզրահանգումներ անել և ադապտացվել", 

                    "Տեխնոլոգիաների և ծրագրային լուծումների համակցություն է, որը կիրառվում է մեծածավալ տվյալների մշակման և ավտոմատ որոշումների կայացման համար՝ անկախ ինտելեկտուալ կարողություններից"

                ], 

                correct: 2, 

                feedback: "Արհեստական բանականությունը հենց սովորելու և ադապտացվելու կարողությունն է:",

                topic: "ԱԲ-ի սահմանում"

            },

            { 

                q: "Ո՞րն է Գեներատիվ Արհեստական Բանականության (Generative ԱԲ) հիմնական առանձնահատկությունը:", 

                options: [

                    "Միայն տվյալների վերլուծությունը և պահպանումը", 

                    "Նոր բովանդակության (տեքստ, պատկեր, ձայն) ստեղծումը", 

                    "Համակարգիչների արագագործության մեխանիկական մեծացումը", 

                    "Տվյալների բազաների կառուցվածքային դասավորումը"

                ], 

                correct: 1, 

                feedback: "Գեներատիվ ԱԲ-ն ստեղծում է բոլորովին նոր բովանդակություն՝ նմանակելով մարդկային ստեղծարարությունը:",

                topic: "Գեներատիվ ԱԲ"

            },

            { 

                q: "Ո՞րն է արհեստական բանականության հիմնական առավելություններից մեկը:", 

                options: [

                    "Կրճատում է խնդիրների լուծման համար պահանջվող ժամանակը", 

                    "Օգնում է անվտանգության ապահովման հարցերում", 

                    "Աջակցում է դասավանդման և ուսումնառության գործընթացներին", 

                    "Բոլոր նշվածները"

                ], 

                correct: 3, 

                feedback: "Արհեստական բանականությունը բազմակողմանի գործիք է և տալիս է բոլոր այս առավելությունները:",

                topic: "ԱԲ առավելություններ"

            },

            { 

                q: "Ի՞նչ է ԱԲ-ի «հալյուցինացիան» (Hallucination):", 

                options: [

                    "Համակարգի հանկարծակի անջատումը գերծանրաբեռնվածությունից", 

                    "Վստահ հնչող, բայց սխալ կամ հորինված տեղեկություն տրամադրելը", 

                    "Պատկերների գույների սխալ արտացոլումը", 

                    "Ծրագրային կոդի մեջ առկա տեխնիկական սխալը"

                ], 

                correct: 1, 

                feedback: "Հալյուցինացիան այն է, երբ ԱԲ-ն սխալ տվյալը մատուցում է որպես փաստ:",

                topic: "ԱԲ սահմանափակումներ"

            },

            { 

                q: "Ո՞ր համակարգն է կատարում առաջադրանքներ՝ օգտագործելով կանխորոշված կանոններ և արտաքին գործիքներ:", 

                options: [

                    "Գեներատիվ ԱԲ", 

                    "ԱԲ Գործակալներ (AI Agents)", 

                    "Փորձագիտական համակարգեր", 

                    "Ամրապնդմամբ ուսուցման ԱԲ"

                ], 

                correct: 1, 

                feedback: "ԱԲ Գործակալները կարող են ինքնուրույն օգտվել գործիքներից՝ նպատակին հասնելու համար:",

                topic: "ԱԲ Գործակալներ"

            },

            { 

                q: "Ո՞րն է արհեստական բանականության սահմանափակումներից մեկը:", 

                options: [

                    "Այն չափազանց թանկ է և անհասանելի անհատների համար", 

                    "Այն չի կարող աշխատել առանց մշտական ինտերնետ կապի", 

                    "Այն կարող է տալ սխալ կամ հորինված պատասխաններ", 

                    "Այն չի կարող գեներացնել երկար տեքստեր"

                ], 

                correct: 2, 

                feedback: "Սխալ պատասխաններ տալը ԱԲ-ի հիմնական սահմանափակումներից է:",

                topic: "ԱԲ սահմանափակումներ"

            },

            { 

                q: "Ինչպե՞ս է կոչվում ԱԲ մոդելը, որը կարող է միաժամանակ մշակել և սինթեզել տեքստ, պատկեր, վիդեո և ձայն:", 

                options: [

                    "Լեզվական մոդել (LLM)", 

                    "Համակարգչային տեսողություն", 

                    "Բազմամոդալ ԱԲ (Multimodal ԱԲ)", 

                    "Գեներատիվ հակառակորդ ցանցեր (GAN)"

                ], 

                correct: 2, 

                feedback: "Բազմամոդալ մոդելները կարող են միաժամանակ հասկանալ տարբեր տիպի տվյալներ:",

                topic: "Մուլտիմոդալություն"

            },

            { 

                q: "Ի՞նչ է «փրոմփթը» (Prompt) կամ հրահանգը:", 

                options: [

                    "Արհեստական բանականության մուտքային գաղտնաբառը", 

                    "Հրահանգ կամ հարցում, որը տրվում է ԱԲ-ին պատասխան ստանալու համար", 

                    "Համակարգի սխալների մասին հաղորդագրությունը", 

                    "Էկրանի լուսավորության կարգավորման կոճակը"

                ], 

                correct: 1, 

                feedback: "Փրոմփթը այն մուտքային տվյալն է, որի հիման վրա ԱԲ-ն գեներացնում է պատասխանը:",

                topic: "Փրոմփթինգ"

            },

            { 

                q: "Ավանդական հրահանգների ինժեներիայի փոխարեն ի՞նչ այլ տեխնիկա է առաջարկվում ԱԲ-ի հետ աշխատանքում:", 

                options: [

                    "Փրոմփթի օպտիմալացում (Prompt Tuning)", 

                    "Կոնտեքստի ձևավորում (Context Design)", 

                    "Սցենարական գրագրություն", 

                    "Տվյալների պիտակավորում"

                ], 

                correct: 1, 

                feedback: "Context Design-ը թույլ է տալիս ԱԲ-ին ավելի լավ հասկանալ միջավայրը և խնդիրը:",

                topic: "Context Design"

            },

            { 

                q: "Ո՞ր մոտեցումն է առավել արդյունավետ կրթական որակը պահպանելու համար, երբ օգտագործվում է ԱԲ:", 

                options: [

                    "Ամբողջ ուսումնական նյութի ստեղծումը թողնել ԱԲ-ին", 

                    "Օգտագործել ԱԲ-ն միայն որպես առաջին սևագիր, ապա կատարել վերանայում",

        const audioPhrases = {

            correct: ["Ապրե՛ս, դու ճիշտ ես:", "Միանգամայն ճիշտ է:", "Հրաշալի է, ճիշտ պատասխան էր:"],

            wrong: ["Ցավոք, սա սխալ էր:", "Ոչ, սա ճիշտ տարբերակը չէ էր:", "Այս անգամ չստացվեց:"],

            next: ["Անցնենք առաջ:", "Շարունակենք:", "Հաջորդ հարցը:"]

        // Universal Stop Audio Function

        function stopAllAudio() {

            audioTaskId++; // Increment to invalidate previous speak tasks

            if (currentAudio) {

                currentAudio.pause();

                currentAudio.src = ""; 

                currentAudio.load();

                currentAudio = null;

            }

            // Hide all indicators

            document.getElementById('speaking-indicator')?.classList.add('hidden');

            document.getElementById('intro-speaking-indicator')?.classList.add('hidden');

            document.getElementById('ai-avatar')?.classList.remove('ai-pulse');

            document.getElementById('welcome-avatar')?.classList.remove('ai-pulse');

        }



        async function speak(text, customIndicatorId = null) {

            stopAllAudio(); // Immediate pause

            const taskId = audioTaskId; // Capture current ID

            

            const globalIndicator = document.getElementById('speaking-indicator');

            const customIndicator = customIndicatorId ? document.getElementById(customIndicatorId) : null;

            const avatar = document.getElementById('ai-avatar');

            const welcomeAvatar = document.getElementById('welcome-avatar');



            let delay = 1000;

            for (let i = 0; i < 5; i++) {

                if (taskId !== audioTaskId) return; // Abort if stopAllAudio was called

                

                try {

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {

                        method: 'POST',

                        headers: { 'Content-Type': 'application/json' },

                        body: JSON.stringify({

                            contents: [{ parts: [{ text: text }] }],

                            generationConfig: {

                                responseModalities: ["AUDIO"],

                                speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } }

                            },

                            model: "gemini-2.5-flash-preview-tts"

                        })

                    });

                    

                    if (!response.ok) throw new Error("TTS API fail");



                    const result = await response.json();

                    if (taskId !== audioTaskId) return; // Second check after await



                    const audioData = result.candidates?.[0]?.content?.parts?.[0]?.inlineData;

                    if (audioData) {

                        const binary = atob(audioData.data);

                        const bytes = new Int16Array(binary.length / 2);

                        for (let j = 0; j < binary.length; j += 2) {

                            bytes[j / 2] = (binary.charCodeAt(j + 1) << 8) | binary.charCodeAt(j);

                        }

                        

                        const wavBuffer = pcmToWav(bytes, 24000);

                        const url = URL.createObjectURL(new Blob([wavBuffer], { type: 'audio/wav' }));

                        

                        if(globalIndicator) globalIndicator.classList.remove('hidden');

                        if(customIndicator) customIndicator.classList.remove('hidden');

                        if(avatar) avatar.classList.add('ai-pulse');

                        if(welcomeAvatar) welcomeAvatar.classList.add('ai-pulse');



                        return new Promise((resolve) => {

                            if (taskId !== audioTaskId) return resolve(); // Final check



                            const audioObj = new Audio(url);

                            currentAudio = audioObj;

                            audioObj.onended = () => { 

                                if (currentAudio === audioObj) {

                                    if(globalIndicator) globalIndicator.classList.add('hidden'); 

                                    if(customIndicator) customIndicator.classList.add('hidden');

                                    if(avatar) avatar.classList.remove('ai-pulse'); 

                                    if(welcomeAvatar) welcomeAvatar.classList.remove('ai-pulse');

                                    currentAudio = null;

                                }

                                resolve(); 

                            };

                            audioObj.onerror = () => resolve();

                            audioObj.play().catch(() => resolve());

                        });

                    } else {

                        throw new Error("No data");

                    }

                } catch (e) {

                    if (i === 4) return stopAllAudio();

                    await new Promise(r => setTimeout(r, delay));

                    delay *= 2;

                }

            }

        }



        async function callGeminiLLM(prompt, systemInstruction = "") {

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const thinking = document.getElementById('ai-thinking');

            if(thinking) thinking.classList.remove('hidden');



            let delay = 1000;

            for (let i = 0; i < 5; i++) {

                try {

                    const response = await fetch(url, {

                        method: 'POST',

                        headers: { 'Content-Type': 'application/json' },

                        body: JSON.stringify({

                            contents: [{ parts: [{ text: prompt }] }],

                            systemInstruction: { parts: [{ text: systemInstruction }] }

                        })

                    });

                    if (!response.ok) throw new Error("LLM API call failed");

                    const result = await response.json();

                    if(thinking) thinking.classList.add('hidden');

                    return result.candidates?.[0]?.content?.parts?.[0]?.text || "Սխալ:";

                } catch (e) {

                    if (i === 4) {

                        if(thinking) thinking.classList.add('hidden');

                        return "Կապի խնդիր:";

                    }

                    await new Promise(r => setTimeout(r, delay));

                    delay *= 2;

                }

            }

        }



        function pcmToWav(pcmData, sampleRate) {

            const buffer = new ArrayBuffer(44 + pcmData.length * 2);

            const view = new DataView(buffer);

            const writeS = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };

            writeS(0, 'RIFF'); view.setUint32(4, 32 + pcmData.length * 2, true);

            writeS(8, 'WAVE'); writeS(12, 'fmt '); view.setUint32(16, 16, true);

            view.setUint16(20, 1, true); view.setUint16(22, 1, true);

            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);

            view.setUint16(32, 2, true); view.setUint16(34, 16, true);

            writeS(36, 'data'); view.setUint32(40, pcmData.length * 2, true);

            for (let i = 0; i < pcmData.length; i++) view.setInt16(44 + i * 2, pcmData[i], true);

            return buffer;

        }

        async function showQuestion() {

            document.getElementById('progress-bar').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

            document.getElementById('q-text').innerText = q.q;

            

            const grid = document.getElementById('options-grid');

            grid.innerHTML = '';

            q.options.forEach((opt, i) => {

                const btn = document.createElement('button');

                btn.className = "option-btn text-left p-5 rounded-2xl bg-white/5 border border-white/10 flex items-center gap-4 disabled:opacity-50 w-full text-white";

                btn.innerHTML = `<span class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-lg text-white shrink-0">${String.fromCharCode(65 + i)}</span> <span class="text-lg">${opt}</span>`;

                btn.onclick = () => selectOption(i);

                grid.appendChild(btn);

            });



            document.getElementById('feedback-area').classList.add('hidden');

            document.getElementById('next-btn').classList.add('hidden');

        async function selectOption(idx) {

            const q = questions[currentQuestion];

            const btns = document.querySelectorAll('.option-btn');

            btns.forEach(b => b.disabled = true);

            

            const feedbackArea = document.getElementById('feedback-area');

            const feedbackBox = document.getElementById('feedback-box');

            document.getElementById('ai-deep-dive').classList.add('hidden');

            document.getElementById('ask-more-btn').classList.remove('hidden');

            feedbackArea.classList.remove('hidden');

            

            let prefix = "";

            if (idx === q.correct) {

                score++;

                btns[idx].classList.add('bg-green-500/20', 'border-green-500/50');

                feedbackBox.innerHTML = `<p class="text-green-400 font-bold text-lg">✅ Ճիշտ է!</p><p class="opacity-80">${q.feedback}</p>`;

                prefix = audioPhrases.correct[Math.floor(Math.random() * audioPhrases.correct.length)];

            } else {

                wrongTopics.push(q.topic);

                btns[idx].classList.add('bg-red-500/20', 'border-red-500/50');

                btns[q.correct].classList.add('bg-green-500/20', 'border-green-500/50');

                feedbackBox.innerHTML = `<p class="text-red-400 font-bold text-lg">❌ Սխալ է</p><p class="opacity-80">${q.feedback}</p>`;

                prefix = audioPhrases.wrong[Math.floor(Math.random() * audioPhrases.wrong.length)];

            }



            // Handle Last Question UI

            const isLast = currentQuestion === questions.length - 1;

            const nextBtn = document.getElementById('next-btn');

            const nextBtnText = document.getElementById('next-btn-text');

            

            nextBtnText.innerText = isLast ? "Ավարտել քուիզը" : "Հաջորդ հարցը";

            nextBtn.classList.remove('hidden');



            const nextP = isLast ? "Ավարտենք քուիզը:" : audioPhrases.next[Math.floor(Math.random() * audioPhrases.next.length)];

            const vocalFeedback = q.feedback.replace(/AI/gi, "ԱԲ").replace(/ԱԻ/gi, "ԱԲ");

            

            await speak(`${prefix} ${vocalFeedback} ... ${nextP}`);

        }

            const userPrompt = `Թեման՝ ${q.topic}։ Հարց՝ ${q.q}։ Ճիշտ պատասխան՝ ${q.options[q.correct]}։ Տուր խորհուրդ ԱԲ-ն այս թեմայում արդյունավետ կիրառելու համար։`;

            diveBox.innerHTML = `✨ <b>ԱԲ-ի բացատրությունը.</b> ${explanation}`;

            await speak(closingSpeech);
